services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hishabkhata
      POSTGRES_USER: hishabkhata
      POSTGRES_PASSWORD: hishabkhata_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hishabkhata_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hishabkhata -d hishabkhata"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  hishabkhata_postgres:
